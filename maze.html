<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>方块走迷宫</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #fff3d6; touch-action: none; }
    body { position: fixed; inset: 0; }
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    #home-link {
      position: fixed; z-index: 30;
      left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255, 255, 255, 0.9); border: 2px solid rgba(255, 143, 179, 0.45);
      color: #a84e70; font-size: 20px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    #home-link:hover { background: #ffffff; }
    #home-link:active { transform: scale(0.92); }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/maze-game.js"></script>
</head>
<body>
<main id="game-root" aria-label="方块走迷宫游戏"></main>
<a id="home-link" href="./index.html" aria-label="返回首页">&#8592;</a>
<script>
(function () {
  function isPortrait() { return window.innerHeight > window.innerWidth; }
  const portrait = isPortrait();
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: portrait ? 540 : 960,
    height: portrait ? 960 : 540,
    backgroundColor: '#fff3d6',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.MazeGameScene],
  });

  let lastPortrait = portrait;
  window.addEventListener('resize', () => {
    const nextPortrait = isPortrait();
    if (nextPortrait !== lastPortrait) {
      lastPortrait = nextPortrait;
      window.location.reload();
    }
  });
})();
</script>
</body>
</html>
