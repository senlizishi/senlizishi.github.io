<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>蚂蚁搬砖</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #12101f; touch-action: none; }
    body { position: fixed; inset: 0; }
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; }
    .ctl {
      position: fixed; z-index: 30; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(31, 26, 51, 0.88); border: 2px solid rgba(176, 160, 226, 0.42);
      color: #f5eeff; font-size: 19px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    .ctl:hover { background: #2b2346; }
    .ctl:active { transform: scale(0.92); }
    #home-link { left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #top-controls {
      position: fixed; z-index: 30; display: flex; gap: 8px;
      right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top));
    }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/ants-game.js"></script>
</head>
<body>
<main id="game-root" aria-label="蚂蚁搬砖游戏"></main>
<img id="pattern-source" src="assets/ants-pattern.png" alt="" style="display:none">
<a id="home-link" class="ctl" href="./index.html" aria-label="返回首页">←</a>
<div id="top-controls">
  <a id="sound-link" class="ctl" href="#" aria-label="声音开关">🔊</a>
  <a id="restart-link" class="ctl" href="#" aria-label="再来一局">↻</a>
</div>
<script>
const PATTERN_COLS = 32;
const PATTERN_ROWS = 32;

function hexToRgb(hex) { return [(hex >> 16) & 255, (hex >> 8) & 255, hex & 255]; }

function preparePattern(image) {
  const palette = (window.AntsPalette || []).map(hexToRgb);
  if (!palette.length) return;
  const canvas = document.createElement('canvas');
  canvas.width = PATTERN_COLS;
  canvas.height = PATTERN_ROWS;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(image, 0, 0, PATTERN_COLS, PATTERN_ROWS);
  const data = ctx.getImageData(0, 0, PATTERN_COLS, PATTERN_ROWS).data;
  const cells = [];
  for (let y = 0; y < PATTERN_ROWS; y += 1) {
    const row = [];
    for (let x = 0; x < PATTERN_COLS; x += 1) {
      const offset = (y * PATTERN_COLS + x) * 4;
      const r = data[offset];
      const g = data[offset + 1];
      const b = data[offset + 2];
      let bestIndex = 0;
      let bestDistance = Infinity;
      for (let colorIndex = 0; colorIndex < palette.length; colorIndex += 1) {
        const paletteColor = palette[colorIndex];
        const distance = (r - paletteColor[0]) ** 2 + (g - paletteColor[1]) ** 2 + (b - paletteColor[2]) ** 2;
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = colorIndex;
        }
      }
      row.push(bestIndex);
    }
    cells.push(row);
  }
  window.AntsPatternData = { cols: PATTERN_COLS, rows: PATTERN_ROWS, cells: cells };
}

function bootGame() {
  const portraitLayout = window.innerHeight > window.innerWidth;
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: portraitLayout ? 540 : 960,
    height: portraitLayout ? 960 : 540,
    backgroundColor: '#12101f',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.AntsGameScene],
  });

  let lastPortraitLayout = portraitLayout;
  window.addEventListener('resize', () => {
    const nextPortraitLayout = window.innerHeight > window.innerWidth;
    if (nextPortraitLayout !== lastPortraitLayout) {
      lastPortraitLayout = nextPortraitLayout;
      window.location.reload();
    }
  });

  window.game.events.once('ready', () => {
    const scene = window.game.scene.getScene('AntsGameScene');
    const restartLink = document.getElementById('restart-link');
    const soundLink = document.getElementById('sound-link');
    if (restartLink) {
      restartLink.addEventListener('click', (event) => {
        event.preventDefault();
        if (scene && scene.resetGame) scene.resetGame();
      });
    }
    if (soundLink) {
      soundLink.addEventListener('click', (event) => {
        event.preventDefault();
        const on = window.AntsAudio ? window.AntsAudio.toggleMute() : true;
        soundLink.textContent = on ? '🔊' : '🔇';
      });
    }
  });
}

const patternSource = document.getElementById('pattern-source');
function startGameWithPattern() {
  try { preparePattern(patternSource); } catch (_) { window.AntsPatternData = null; }
  bootGame();
}
if (patternSource.complete && patternSource.naturalWidth) {
  startGameWithPattern();
} else {
  patternSource.addEventListener('load', startGameWithPattern);
  patternSource.addEventListener('error', bootGame);
}
</script>
</body>
</html>
