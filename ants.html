<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>蚂蚁搬砖</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #12101f; touch-action: none; }
    body { position: fixed; inset: 0; }
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; }
    .ctl {
      position: fixed; z-index: 30; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(31, 26, 51, 0.88); border: 2px solid rgba(176, 160, 226, 0.42);
      color: #f5eeff; font-size: 19px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    .ctl:hover { background: #2b2346; }
    .ctl:active { transform: scale(0.92); }
    #home-link { left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #speed-link { width: auto; padding: 0 11px; border-radius: 20px; font-size: 14px; }
    #top-controls {
      position: fixed; z-index: 30; display: flex; gap: 8px;
      right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top));
    }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/ants-game.js"></script>
</head>
<body>
<main id="game-root" aria-label="蚂蚁搬砖游戏"></main>
<a id="home-link" class="ctl" href="./index.html" aria-label="返回首页">&#8592;</a>
<div id="top-controls">
  <a id="speed-link" class="ctl" href="#" aria-label="速度">中速</a>
  <a id="sound-link" class="ctl" href="#" aria-label="声音开关">&#128266;</a>
  <a id="restart-link" class="ctl" href="#" aria-label="再来一局">&#8635;</a>
</div>
<script>
const PATTERN_COLS = 30;
const PATTERN_ROWS = 35;

function rgbToHex(r, g, b) {
  return (((r & 255) << 16) | ((g & 255) << 8) | (b & 255)) >>> 0;
}

function clampChannel(value) {
  return Math.max(0, Math.min(255, Math.round(value)));
}

function makeBox(pixels) {
  let rMin = 255;
  let gMin = 255;
  let bMin = 255;
  let rMax = 0;
  let gMax = 0;
  let bMax = 0;
  for (let i = 0; i < pixels.length; i += 1) {
    const p = pixels[i];
    if (p[0] < rMin) rMin = p[0];
    if (p[1] < gMin) gMin = p[1];
    if (p[2] < bMin) bMin = p[2];
    if (p[0] > rMax) rMax = p[0];
    if (p[1] > gMax) gMax = p[1];
    if (p[2] > bMax) bMax = p[2];
  }
  return { pixels: pixels, rMin: rMin, rMax: rMax, gMin: gMin, gMax: gMax, bMin: bMin, bMax: bMax };
}

function boxRange(box) {
  return Math.max(box.rMax - box.rMin, box.gMax - box.gMin, box.bMax - box.bMin);
}

function medianCut(pixels, colorCount) {
  let boxes = [makeBox(pixels)];
  while (boxes.length < colorCount) {
    let bestIndex = 0;
    let bestRange = -1;
    for (let i = 0; i < boxes.length; i += 1) {
      const range = boxRange(boxes[i]);
      if (range > bestRange) {
        bestRange = range;
        bestIndex = i;
      }
    }
    if (bestRange <= 0) break;
    const box = boxes[bestIndex];
    let channel = 0;
    let width = box.rMax - box.rMin;
    if (box.gMax - box.gMin > width) {
      channel = 1;
      width = box.gMax - box.gMin;
    }
    if (box.bMax - box.bMin > width) {
      channel = 2;
      width = box.bMax - box.bMin;
    }
    const sorted = box.pixels.slice().sort((a, b) => a[channel] - b[channel]);
    const mid = Math.max(1, Math.floor(sorted.length / 2));
    const left = sorted.slice(0, mid);
    const right = sorted.slice(mid);
    if (!left.length || !right.length) break;
    boxes.splice(bestIndex, 1, makeBox(left), makeBox(right));
  }
  return boxes.map((box) => {
    const n = box.pixels.length;
    let r = 0;
    let g = 0;
    let b = 0;
    for (let i = 0; i < n; i += 1) {
      r += box.pixels[i][0];
      g += box.pixels[i][1];
      b += box.pixels[i][2];
    }
    return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
  });
}

function preparePattern(image, patternIndex) {
  const canvas = document.createElement('canvas');
  canvas.width = PATTERN_COLS;
  canvas.height = PATTERN_ROWS;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const targetAspect = PATTERN_COLS / PATTERN_ROWS;
  const imageWidth = image.naturalWidth || image.width;
  const imageHeight = image.naturalHeight || image.height;
  let sourceX = 0;
  let sourceY = 0;
  let sourceWidth = imageWidth;
  let sourceHeight = imageHeight;
  if (imageWidth / imageHeight > targetAspect) {
    sourceWidth = Math.round(imageHeight * targetAspect);
    sourceX = Math.round((imageWidth - sourceWidth) / 2);
  } else {
    sourceHeight = Math.round(imageWidth / targetAspect);
    sourceY = Math.round((imageHeight - sourceHeight) / 2);
  }
  ctx.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, PATTERN_COLS, PATTERN_ROWS);
  const data = ctx.getImageData(0, 0, PATTERN_COLS, PATTERN_ROWS).data;
  const pixels = [];
  for (let y = 0; y < PATTERN_ROWS; y += 1) {
    for (let x = 0; x < PATTERN_COLS; x += 1) {
      const offset = (y * PATTERN_COLS + x) * 4;
      pixels.push([data[offset], data[offset + 1], data[offset + 2]]);
    }
  }
  const paletteRgb = medianCut(pixels, 16);
  const palette = paletteRgb.map((rgb) => {
    const r = rgb[0];
    const g = rgb[1];
    const b = rgb[2];
    return {
      base: rgbToHex(r, g, b),
      dark: rgbToHex(clampChannel(r * 0.62), clampChannel(g * 0.62), clampChannel(b * 0.62)),
      light: rgbToHex(clampChannel(r + (255 - r) * 0.38), clampChannel(g + (255 - g) * 0.38), clampChannel(b + (255 - b) * 0.38)),
    };
  });
  const cells = [];
  for (let y = 0; y < PATTERN_ROWS; y += 1) {
    const row = [];
    for (let x = 0; x < PATTERN_COLS; x += 1) {
      const p = pixels[y * PATTERN_COLS + x];
      let bestIndex = 0;
      let bestDistance = Infinity;
      for (let colorIndex = 0; colorIndex < paletteRgb.length; colorIndex += 1) {
        const c = paletteRgb[colorIndex];
        const distance = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2;
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = colorIndex;
        }
      }
      row.push(bestIndex);
    }
    cells.push(row);
  }
  return { cells: cells, palette: palette, label: '样式 ' + (patternIndex + 1) };
}

function bootGame() {
  const portraitLayout = window.innerHeight > window.innerWidth;
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: portraitLayout ? 540 : 960,
    height: portraitLayout ? 960 : 540,
    backgroundColor: '#12101f',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.AntsGameScene],
  });

  let lastPortraitLayout = portraitLayout;
  window.addEventListener('resize', () => {
    const nextPortraitLayout = window.innerHeight > window.innerWidth;
    if (nextPortraitLayout !== lastPortraitLayout) {
      lastPortraitLayout = nextPortraitLayout;
      window.location.reload();
    }
  });

  window.game.events.once('ready', () => {
    const scene = window.game.scene.getScene('AntsGameScene');
    const restartLink = document.getElementById('restart-link');
    const soundLink = document.getElementById('sound-link');
    const speedLink = document.getElementById('speed-link');
    if (restartLink) {
      restartLink.addEventListener('click', (event) => {
        event.preventDefault();
        if (scene && scene.resetGame) scene.resetGame();
      });
    }
    if (soundLink) {
      soundLink.addEventListener('click', (event) => {
        event.preventDefault();
        const on = window.AntsAudio ? window.AntsAudio.toggleMute() : true;
        soundLink.textContent = on ? '\u{1F50A}' : '\u{1F507}';
      });
    }
    if (speedLink) {
      const speedLabels = ['慢速', '中速', '快速'];
      const speedValues = [160, 280, 400];
      let speedIndex = 1;
      speedLink.addEventListener('click', (event) => {
        event.preventDefault();
        speedIndex = (speedIndex + 1) % speedLabels.length;
        if (scene && scene.setWorkerSpeed) scene.setWorkerSpeed(speedValues[speedIndex]);
        speedLink.textContent = speedLabels[speedIndex];
        if (window.AntsAudio) window.AntsAudio.select();
      });
    }
  });
}

const patternFiles = ['pattern-01.jpg', 'pattern-02.jpg', 'pattern-03.jpg', 'pattern-04.jpg', 'pattern-05.jpg', 'pattern-06.jpg', 'pattern-07.jpg', 'pattern-08.jpg', 'pattern-09.jpg', 'pattern-10.jpg'];
const patternSources = patternFiles.map((file) => {
  const image = new Image();
  image.src = 'assets/' + encodeURIComponent(file);
  return image;
});
let remainingSources = patternSources.length;
function onPatternSourceReady() {
  remainingSources -= 1;
  if (remainingSources > 0) return;
  window.AntsPatterns = [];
  for (let i = 0; i < patternSources.length; i += 1) {
    if (!patternSources[i].naturalWidth) continue;
    const pattern = preparePattern(patternSources[i], i);
    if (pattern) window.AntsPatterns.push(pattern);
  }
  if (!window.AntsPatterns.length) window.AntsPatterns = null;
  bootGame();
}
patternSources.forEach((image) => {
  if (image.complete && image.naturalWidth) onPatternSourceReady();
  else {
    image.addEventListener('load', onPatternSourceReady, { once: true });
    image.addEventListener('error', onPatternSourceReady, { once: true });
  }
});
</script>
</body>
</html>
