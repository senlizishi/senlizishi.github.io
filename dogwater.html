<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>小狗浇花</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #eaf9ff; touch-action: none; }
    body { position: fixed; inset: 0; }
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    #home-link {
      position: fixed; z-index: 30;
      left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255, 248, 234, 0.94); border: 2px solid rgba(126, 166, 102, 0.55);
      color: #435B3D; font-size: 20px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(47, 74, 43, 0.22);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    #home-link:hover { background: #ffffff; }
    #home-link:active { transform: scale(0.92); }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/dogwater-game.js?v=3"></script>
</head>
<body>
<main id="game-root" aria-label="小狗浇花"></main>
<a id="home-link" href="./index.html" aria-label="????">&#8592;</a>
<script>
(function () {
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: 540,
    height: 960,
    backgroundColor: '#BFE9FF',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.DogWaterScene],
  });
})();
</script>
</body>
</html>
