<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>果冻叠叠乐</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; background: #bcecff; touch-action: none; }
    body {
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game-root { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; }
    @media (orientation: portrait) {
      canvas {
        width: min(100%, calc(100vh * 0.5625)) !important;
        width: min(100%, calc(100dvh * 0.5625)) !important;
        height: min(100vh, calc(100vw * 1.777778)) !important;
        height: min(100dvh, calc(100vw * 1.777778)) !important;
      }
    }
    @media (orientation: landscape) {
      canvas {
        width: min(100vw, calc(100vh * 1.777778)) !important;
        width: min(100vw, calc(100dvh * 1.777778)) !important;
        height: min(100vh, calc(100vw * 0.5625)) !important;
        height: min(100dvh, calc(100vw * 0.5625)) !important;
      }
    }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/jelly-game.js"></script>
</head>
<body>
<main id="game-root" aria-label="果冻叠叠乐游戏"></main>
<script>
const portraitLayout = window.innerHeight > window.innerWidth;
window.game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-root',
  width: portraitLayout ? 540 : 960,
  height: portraitLayout ? 960 : 540,
  backgroundColor: '#120d27',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.NO_CENTER, expandParent: false },
  physics: {
    default: 'matter',
    matter: { gravity: { y: 1.12 }, enableSleeping: true, debug: false },
  },
  scene: [window.JellyTitleScene, window.JellyGameScene],
});

let lastPortraitLayout = portraitLayout;
window.addEventListener('resize', () => {
  const nextPortraitLayout = window.innerHeight > window.innerWidth;
  if (nextPortraitLayout !== lastPortraitLayout) {
    lastPortraitLayout = nextPortraitLayout;
    window.location.reload();
  }
});
</script>
</body>
</html>
