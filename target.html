<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>弹珠打靶</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #BFE9FF; touch-action: none; }
    body { position: fixed; inset: 0; }
    /* 居中交给 Phaser 的 autoCenter 负责，这里不能再加 flex 居中，否则会双重偏移 */
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    #home-link {
      position: fixed; z-index: 30;
      left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255, 255, 255, 0.9); border: 2px solid rgba(232, 80, 58, 0.55);
      color: #b23c1c; font-size: 20px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    #home-link:hover { background: #ffffff; }
    #home-link:active { transform: scale(0.92); }
    /* 横屏专用：竖屏时盖一层提示，只是盖住，不重载也不暂停。
       z-index 比 #home-link(30) 低，所以返回首页按钮永远点得到。 */
    #rotate-hint {
      position: fixed; inset: 0; z-index: 20; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: rgba(18, 30, 48, 0.94); color: #FFF3D6; text-align: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif; padding: 24px;
      -webkit-tap-highlight-color: transparent;
    }
    #rotate-hint svg { width: 88px; height: 88px; }
    #rotate-hint .big { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
    #rotate-hint .small { font-size: 15px; opacity: 0.78; }
    @media (orientation: portrait) { #rotate-hint { display: flex; } }
    @media (orientation: landscape) { #rotate-hint { display: none; } }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/target-game.js?v=2"></script>
</head>
<body>
<main id="game-root" aria-label="弹珠打靶"></main>
<a id="home-link" href="./index.html" aria-label="返回首页">&#8592;</a>
<div id="rotate-hint" aria-hidden="true">
  <svg viewBox="0 0 100 100" fill="none" stroke="#FFF3D6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="32" y="14" width="36" height="58" rx="8"/>
    <line x1="44" y1="64" x2="56" y2="64"/>
    <path d="M16 84 a42 42 0 0 0 68 0" stroke-dasharray="10 10"/>
    <path d="M14 72 l2 12 12 -2"/>
  </svg>
  <div class="big">把手机横过来玩</div>
  <div class="small">这个游戏是横屏的</div>
</div>
<script>
(function () {
  // 横屏专用：竖屏时由 #rotate-hint 盖住画面给提示，不重载、不暂停
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: 960,
    height: 540,
    backgroundColor: '#BFE9FF',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.TargetScene],
  });
})();
</script>
</body>
</html>
