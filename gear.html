<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>齿轮工坊</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #24140D; touch-action: none; }
    body { position: fixed; inset: 0; }
    /* 居中交给 Phaser 的 autoCenter，这里不能再加 flex 居中，否则会双重偏移 */
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    #home-link {
      position: fixed; z-index: 30;
      left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255, 242, 211, 0.92); border: 2px solid rgba(225, 182, 90, 0.62);
      color: #4B2B19; font-size: 20px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    #home-link:hover { background: #fff8e6; }
    #home-link:active { transform: scale(0.92); }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/gear-game.js?v=1"></script>
</head>
<body>
<main id="game-root" aria-label="齿轮工坊"></main>
<a id="home-link" href="./index.html" aria-label="返回首页">&#8592;</a>
<script>
(function () {
  // 只做竖屏：横屏时用 FIT 缩放居中显示，不需要重载
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: 540,
    height: 960,
    backgroundColor: '#24140D',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.GearScene],
  });
})();
</script>
</body>
</html>
