<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>flower preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #fdf6ec; overflow: hidden; }
  #game-root { width: 100vw; height: 100vh; overflow: hidden; }
  canvas { display: block; }
  #dbg { display: none; position: fixed; left: 0; top: 0; z-index: 99; background: rgba(0,0,0,.75); color: #fff; font: 12px monospace; padding: 4px 8px; max-width: 100%; }
</style>
<script src="./phaser.min.js"></script>
<script src="js/flower-game.js"></script>
</head>
<body>
<div id="game-root"></div>
<div id="dbg">boot</div>
<script>
(function () {
  var dbgEl = document.getElementById('dbg');
  var logs = [];
  function dbg(s) { logs.push(s); dbgEl.style.display = 'block'; dbgEl.textContent = logs.join(' | '); }
  window.onerror = function (m, src, line) { dbg('ERR:' + m + '@' + line); };

  var landscape = window.innerWidth > window.innerHeight;
  window.game = new Phaser.Game({
    type: Phaser.CANVAS,
    parent: 'game-root',
    width: landscape ? 960 : 540,
    height: landscape ? 540 : 960,
    backgroundColor: '#fdf6ec',
    scale: { mode: Phaser.Scale.NONE },
    scene: [window.FlowerScene],
  });

  var hash = window.location.hash.replace('#', '');
  var kv = {};
  hash.split('&').forEach(function (p) {
    var a = p.split('=');
    if (a[0]) kv[a[0]] = a[1] || '';
  });

  var done = false;
  var iv = setInterval(function () {
    if (done) return;
    if (!window.game || !window.game.scene || !window.game.scene.isActive('FlowerScene')) return;
    done = true;
    clearInterval(iv);
    setTimeout(function () {
      try {
        var sc = window.game.scene.getScene('FlowerScene');
        var items = sc.trayItems || [];
        var order = [0, 2, 4, 1, 5, 3, 0, 2, 1];
        for (var i = 0; i < order.length; i++) {
          var it = items[order[i]];
          if (it) sc.plantAt(sc.L.vase.cx, sc.L.vase.lipY - 30, it.def, false);
        }
        if (kv.pose) sc.paintCat(kv.pose, 1);
        if (kv.catx) sc.catRoot.x = Number(kv.catx) || sc.catRoot.x;
      } catch (e) {
        dbg('outer:' + e.message);
      }
      setTimeout(function () {
        window.game.loop.stop();
        try {
          window.game.loop.step(1000);
        } catch (e1) {
          try { window.game.scene.render(1000, 16); } catch (e2) { dbg('r2:' + e2.message); }
        }
        document.title = 'ready';
      }, 400);
    }, 2600);
  }, 100);
})();
</script>
</body>
</html>
