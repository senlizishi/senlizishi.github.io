<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>广东麻将</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    :root {
      --mj-sat: env(safe-area-inset-top, 0px);
      --mj-sab: env(safe-area-inset-bottom, 0px);
      --mj-sal: env(safe-area-inset-left, 0px);
      --mj-sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0916; touch-action: none; }
    body { position: fixed; inset: 0; }
    #game-root { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; }
    #home-link {
      position: fixed; z-index: 30;
      left: max(10px, env(safe-area-inset-left));
      top: max(10px, env(safe-area-inset-top));
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255, 246, 226, 0.82); border: 2px solid rgba(120, 92, 60, 0.35);
      color: #3c2a14; font-size: 19px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    #home-link:hover { background: #fff; }
    #err-log {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; display: none;
      max-height: 42%; overflow: auto; padding: 10px 12px; white-space: pre-wrap; word-break: break-all;
      background: rgba(58, 10, 24, 0.94); color: #ffd9de; border-top: 2px solid #b3355a;
      font: 12px/1.55 Consolas, Menlo, monospace;
    }
    #home-link:active { transform: scale(0.92); }
  </style>
  <script>
  /* 错误早捕：必须注册在库脚本之前。否则脚本加载期/解析期抛错时，
     页面只会留下一块背景色，表现为“黑屏没有任何提示”。 */
  (function () {
    var box = null;
    var lines = [];
    var shown = 0;

    function ensureBox() {
      if (box && box.parentNode) return box;
      box = document.getElementById('err-log') || null;
      if (!box && document.body) {
        box = document.createElement('div');
        box.id = 'err-log';
        box.setAttribute('role', 'alert');
        document.body.appendChild(box);
      }
      return box;
    }

    function flush() {
      var el = ensureBox();
      if (!el || !lines.length) return;
      el.textContent = lines.join('\n');
      el.style.display = 'block';
    }

    window.mjReport = function (where, detail) {
      if (shown >= 8) return;
      shown += 1;
      lines.push('[' + where + '] ' + detail);
      flush();
      if (window.console && window.console.error) window.console.error('[mahjong] ' + lines[lines.length - 1]);
    };

    /* 资源加载失败（script 404 / 被拦截）不冒泡，只能在捕获阶段拿到 */
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target !== window && e.target.tagName) {
        var src = String(e.target.src || e.target.href || '');
        window.mjReport('load', e.target.tagName.toLowerCase() + ' 加载失败: ' + src);
        return;
      }
      var at = e && e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '';
      window.mjReport('error', ((e && e.message) || 'unknown') + at);
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      window.mjReport('promise', String(e && e.reason));
    });

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', flush);
    else flush();
  })();
  </script>
  <script src="./phaser.min.js"></script>
  <script src="js/mahjong/rules.js?v=2"></script>
  <script src="js/mahjong/audio.js?v=2"></script>
  <script src="js/mahjong/art.js?v=10"></script>
  <script src="js/mahjong/game.js?v=14"></script>
</head>
<body>
<main id="game-root" aria-label="广东麻将"></main>
<a id="home-link" href="./index.html" aria-label="返回首页">←</a>
<div id="err-log" role="alert"></div>
<script>
try {
  const clampNum = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  /* 安全区（刘海 / 圆角 / home 指示条）由 CSS env() 读出 */
  function readSafeInsets() {
    let cs = null;
    try { cs = window.getComputedStyle(document.documentElement); } catch (e) { cs = null; }
    const pick = (name) => {
      if (!cs) return 0;
      const n = parseFloat(cs.getPropertyValue(name));
      return Number.isFinite(n) ? n : 0;
    };
    return { top: pick('--mj-sat'), bottom: pick('--mj-sab'), left: pick('--mj-sal'), right: pick('--mj-sar') };
  }

  /* 画布比例 = 屏幕比例：FIT 缩放后正好铺满，不留黑边。
     竖屏固定宽 540，高度跟着屏幕比例走；横屏固定高 540，宽度跟着走。 */
  function computeView() {
    const vw = Math.max(1, window.innerWidth);
    const vh = Math.max(1, window.innerHeight);
    const portrait = vh >= vw;
    const safeCss = readSafeInsets();
    let w;
    let h;
    if (portrait) {
      w = 540;
      h = clampNum(Math.round((w * vh) / vw), 640, 1500);
    } else {
      h = 540;
      w = clampNum(Math.round((h * vw) / vh), 700, 2000);
    }
    const scale = Math.max(0.0001, Math.min(vw / w, vh / h));
    const inv = 1 / scale;
    /* 左上角返回按钮是 DOM 元素，按真实像素折算回画布坐标 */
    const hudInset = Math.max(10 * inv, safeCss.left * inv) + 52 * inv;
    return {
      w: w,
      h: h,
      portrait: portrait,
      safe: {
        top: safeCss.top * inv,
        bottom: safeCss.bottom * inv,
        left: safeCss.left * inv,
        right: safeCss.right * inv,
      },
      hudInset: hudInset,
    };
  }

  const view = computeView();
  window.MahjongView = view;
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game-root',
    width: view.w,
    height: view.h,
    backgroundColor: '#0d0916',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
    scene: [window.MahjongScene],
  });

  /* 看门狗：8 秒还没进入 RUNNING 就把诊断信息打到屏幕上，杜绝“无声黑屏”。 */
  const SCENE_STATUS = ['PENDING', 'INIT', 'START', 'LOADING', 'CREATING', 'RUNNING', 'PAUSED', 'SLEEPING', 'SHUTDOWN', 'DESTROYED'];
  const startedAt = Date.now();
  const watchdog = window.setInterval(() => {
    const scene = window.game && window.game.scene ? window.game.scene.getScene('MahjongScene') : null;
    const status = scene && scene.sys && scene.sys.settings ? scene.sys.settings.status : -1;
    if (status >= 5 || (scene && scene.state === 'playing')) { window.clearInterval(watchdog); return; }
    if (Date.now() - startedAt < 8000) return;
    window.clearInterval(watchdog);
    const textures = window.game ? window.game.textures : null;
    window.mjReport('stuck', '8 秒仍未开局'
      + ' · 渲染器=' + (window.game && window.game.renderer ? window.game.renderer.type : 'none')
      + ' · 场景状态=' + (SCENE_STATUS[status] || status)
      + ' · 贴图(牌/桌/房间)=' + (textures ? [textures.exists('mj-face-0'), textures.exists('mj-table'), textures.exists('mj-room')].join('/') : 'n/a')
      + ' · 画布=' + (window.game && window.game.canvas ? window.game.canvas.width + 'x' + window.game.canvas.height : 'none'));
  }, 500);

  window.game.events.once('ready', () => {
    const canvas = window.game.canvas;
    if (canvas && canvas.addEventListener) {
      canvas.addEventListener('webglcontextlost', () => {
        window.mjReport('webgl', 'WebGL 上下文丢失（显卡驱动或显存不足），刷新页面即可恢复');
      }, false);
    }
  });

  /* 布局是按画布尺寸算死的，所以方向翻转 / 尺寸大幅变化时重建场景。
     手机上地址栏收放只会带来约 10% 的高度变化，不会触发重载。 */
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(() => {
      const next = computeView();
      const flipped = next.portrait !== view.portrait;
      // 只有比例真的变了才重建：画布比例跟屏幕比例一旦差得多就会留黑边
      const ratio = (next.w / next.h) / (view.w / view.h);
      const changed = Math.abs(ratio - 1) > 0.08;
      if (flipped || changed) window.location.reload();
    }, 350);
  });
} catch (error) {
  window.mjReport('init', (error && error.message) || String(error));
}
</script>
</body>
</html>
