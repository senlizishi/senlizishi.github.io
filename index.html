<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>果冻叠叠乐</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #120d27; touch-action: none; }
    canvas { display: block; }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/jelly-game.js"></script>
</head>
<body>
<script>
window.game = new Phaser.Game({
  type: Phaser.AUTO,
  width: 960,
  height: 540,
  backgroundColor: '#120d27',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: {
    default: 'matter',
    matter: { gravity: { y: 1.12 }, enableSleeping: true, debug: false },
  },
  scene: [window.JellyTitleScene, window.JellyGameScene],
});
</script>
</body>
</html>
