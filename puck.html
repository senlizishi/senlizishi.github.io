<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>圆片对战</title>
  <link rel="icon" href="assets/jelly-mark.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden; background: #120d27; touch-action: none; }
    body { position: fixed; inset: 0; }
    #game-root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; flex: none; max-width: 100%; max-height: 100%; }
    .ctl {
      position: fixed; z-index: 30; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(31, 26, 51, 0.9); border: 2px solid rgba(176, 160, 226, 0.42);
      color: #f5eeff; font-size: 19px; line-height: 1; text-decoration: none;
      font-family: "Microsoft YaHei", sans-serif; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      -webkit-tap-highlight-color: transparent; transition: transform 0.12s ease, background 0.12s ease;
    }
    .ctl:hover { background: #2b2346; }
    .ctl:active { transform: scale(0.92); }
    #home-link { left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #sound-link { right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); }
  </style>
  <script src="./phaser.min.js"></script>
  <script src="js/puck-game.js"></script>
</head>
<body>
<main id="game-root" aria-label="圆片对战游戏"></main>
<a id="home-link" class="ctl" href="./index.html" aria-label="返回首页">&#8592;</a>
<a id="sound-link" class="ctl" href="#" aria-label="声音开关">&#128266;</a>
<script>
window.game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-root',
  width: 540,
  height: 960,
  backgroundColor: '#120d27',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH, expandParent: false },
  physics: {
    default: 'matter',
    matter: { gravity: { x: 0, y: 0 }, enableSleeping: false, debug: false },
  },
  scene: [window.PuckGameScene],
});

window.game.events.once('ready', () => {
  const soundLink = document.getElementById('sound-link');
  if (soundLink) {
    soundLink.addEventListener('click', (event) => {
      event.preventDefault();
      const on = window.PuckAudio ? window.PuckAudio.toggleMute() : true;
      soundLink.textContent = on ? '\u{1F50A}' : '\u{1F507}';
    });
  }
});
</script>
</body>
</html>
